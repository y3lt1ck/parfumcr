<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Parfum CR</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        .admin-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .admin-row img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .admin-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .admin-info span {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .admin-actions {
            display: flex;
            gap: 0.5rem;
        }
        .btn-edit, .btn-delete, .btn-cancel {
            border: none;
            border-radius: 6px;
            padding: 0.5rem 0.9rem;
            cursor: pointer;
            font-weight: 600;
            color: white;
        }
        .btn-edit { background: var(--primary); }
        .btn-edit:hover { background: var(--primary-hover); }
        .btn-delete { background: #e74c3c; }
        .btn-delete:hover { background: #c0392b; }
        .btn-cancel {
            background: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            width: 100%;
            margin-top: 0.6rem;
        }
        #session-info {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body style="background: var(--bg-main); padding: 2rem;">

    <!-- FORMULARIO: SUBIR / EDITAR -->
    <div class="info-page-section" style="max-width: 600px; margin: 0 auto 2rem auto;">
        <h1 id="form-title" style="text-align: center;">Gestión de Inventario</h1>
        <p style="text-align: center; color: var(--text-muted);">Sube, edita o elimina los perfumes de la tienda.</p>
        <p id="session-info"></p>

        <form id="admin-product-form" style="margin-top: 1rem;">
            <div class="form-group">
                <label>Nombre del Perfume</label>
                <input type="text" id="prod-name" required>
            </div>
            <div class="form-group">
                <label>Categoría</label>
                <select id="prod-category" style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main);" required>
                    <option value="Hombre">Hombre</option>
                    <option value="Mujer">Mujer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Precio (CRC)</label>
                <input type="number" id="prod-price" required>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea id="prod-desc" required></textarea>
            </div>
            <div class="form-group">
                <label id="image-label">Imagen del Producto</label>
                <input type="file" id="prod-image" accept="image/*" required>
            </div>

            <button type="submit" class="btn-primary" id="btn-upload" style="width: 100%;">Subir Producto</button>
            <button type="button" class="btn-cancel" id="btn-cancel-edit" style="display: none;">Cancelar edición</button>
            <p id="upload-status" style="text-align: center; margin-top: 1rem; font-weight: bold;"></p>
        </form>
    </div>

    <!-- LISTA DE PRODUCTOS -->
    <div class="info-page-section" style="max-width: 600px; margin: 0 auto;">
        <h2 style="margin-top: 0;">Productos publicados</h2>
        <div id="product-list">Cargando...</div>
        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="color: var(--primary);">Volver a la tienda</a>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        let editingId = null;
        let productsCache = [];

        const form = document.getElementById('admin-product-form');
        const btnUpload = document.getElementById('btn-upload');
        const btnCancel = document.getElementById('btn-cancel-edit');
        const status = document.getElementById('upload-status');
        const imageInput = document.getElementById('prod-image');

        function setStatus(text, color) {
            status.textContent = text;
            status.style.color = color;
        }

        // Muestra quién tiene la sesión iniciada
        auth.onAuthStateChanged((user) => {
            const info = document.getElementById('session-info');
            if (user) {
                info.textContent = 'Sesión iniciada: ' + user.email;
                info.style.color = 'green';
            } else {
                info.textContent = 'No has iniciado sesión. Inicia sesión en la tienda con tu cuenta de administrador para poder modificar productos.';
                info.style.color = '#e74c3c';
            }
        });

        // Reduce la imagen y la convierte a texto (base64) para guardarla en Firestore
        function resizeImage(file, maxSize = 500, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("No se pudo leer la imagen"));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error("Archivo de imagen no válido"));
                    img.onload = () => {
                        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // === LISTA DE PRODUCTOS ===
        async function loadProducts() {
            const list = document.getElementById('product-list');
            list.textContent = 'Cargando...';
            try {
                const snapshot = await db.collection('products').orderBy('createdAt', 'desc').get();
                productsCache = [];
                snapshot.forEach(doc => productsCache.push({ id: doc.id, ...doc.data() }));
                renderList();
            } catch (error) {
                list.textContent = 'Error al cargar los productos: ' + error.message;
            }
        }

        function renderList() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';

            if (productsCache.length === 0) {
                list.textContent = 'Aún no hay productos publicados.';
                return;
            }

            productsCache.forEach(p => {
                const row = document.createElement('div');
                row.className = 'admin-row';

                const img = document.createElement('img');
                img.src = p.imageUrl;
                img.alt = p.name;

                const info = document.createElement('div');
                info.className = 'admin-info';
                const title = document.createElement('b');
                title.textContent = p.name;
                const meta = document.createElement('span');
                meta.textContent = p.category + ' · CRC ' + Number(p.price).toLocaleString('es-CR');
                info.append(title, meta);

                const actions = document.createElement('div');
                actions.className = 'admin-actions';

                const btnEdit = document.createElement('button');
                btnEdit.className = 'btn-edit';
                btnEdit.textContent = 'Editar';
                btnEdit.addEventListener('click', () => startEdit(p.id));

                const btnDelete = document.createElement('button');
                btnDelete.className = 'btn-delete';
                btnDelete.textContent = 'Eliminar';
                btnDelete.addEventListener('click', () => deleteProduct(p.id, p.name));

                actions.append(btnEdit, btnDelete);
                row.append(img, info, actions);
                list.appendChild(row);
            });
        }

        // === ELIMINAR ===
        async function deleteProduct(id, name) {
            if (!confirm('¿Eliminar "' + name + '"? Esta acción no se puede deshacer.')) return;

            try {
                await db.collection('products').doc(id).delete();
                productsCache = productsCache.filter(p => p.id !== id);
                if (editingId === id) cancelEdit();
                renderList();
                setStatus('Producto eliminado.', 'green');
            } catch (error) {
                setStatus('Error al eliminar: ' + error.message, 'red');
            }
        }

        // === EDITAR ===
        function startEdit(id) {
            const p = productsCache.find(prod => prod.id === id);
            if (!p) return;

            editingId = id;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-category').value = p.category;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-desc').value = p.description;
            imageInput.value = '';
            imageInput.required = false;

            document.getElementById('form-title').textContent = 'Editar producto';
            document.getElementById('image-label').textContent = 'Imagen (déjala vacía para conservar la actual)';
            btnUpload.textContent = 'Guardar cambios';
            btnCancel.style.display = 'block';
            setStatus('', '');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingId = null;
            form.reset();
            imageInput.required = true;
            document.getElementById('form-title').textContent = 'Gestión de Inventario';
            document.getElementById('image-label').textContent = 'Imagen del Producto';
            btnUpload.textContent = 'Subir Producto';
            btnCancel.style.display = 'none';
        }

        btnCancel.addEventListener('click', () => {
            cancelEdit();
            setStatus('', '');
        });

        // === GUARDAR (SUBIR NUEVO O ACTUALIZAR) ===
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('prod-name').value;
            const category = document.getElementById('prod-category').value;
            const price = Number(document.getElementById('prod-price').value);
            const desc = document.getElementById('prod-desc').value;
            const file = imageInput.files[0];

            btnUpload.disabled = true;
            setStatus('Guardando...', '#3498db');

            try {
                if (editingId) {
                    // Actualizar producto existente
                    const updates = {
                        name: name,
                        category: category,
                        price: price,
                        description: desc,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    if (file) {
                        updates.imageUrl = await resizeImage(file);
                    }
                    await db.collection('products').doc(editingId).update(updates);
                    cancelEdit();
                    setStatus('¡Cambios guardados con éxito!', 'green');
                } else {
                    // Subir producto nuevo
                    const imageUrl = await resizeImage(file);
                    await db.collection('products').add({
                        name: name,
                        category: category,
                        price: price,
                        description: desc,
                        imageUrl: imageUrl,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    form.reset();
                    setStatus('¡Producto publicado con éxito en la tienda!', 'green');
                }
                await loadProducts();
            } catch (error) {
                setStatus('Error: ' + error.message, 'red');
            }
            btnUpload.disabled = false;
        });

        loadProducts();
    </script>
</body>
</html>
